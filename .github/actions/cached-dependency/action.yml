name: composite action to cache dependenciesq
description: A composite action to cache dependencies for a Node.js project
runs:
  using: "composite"
  steps:
      - name: cache node modules
        id: cache-node-modules
        uses: actions/cache@v3
        with: 
             path: node_modules
             key: node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true' # Only run npm ci if the cache was not hit
        shell: bash
        run: npm ci