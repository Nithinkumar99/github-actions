name: Demo Project
on: 
  push:
    branches: 
    - master
  pull_request:
    branches: 
    - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install nodeJS
        uses: actions/setup-node@v3
        with:
            node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  Build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
        
  Deploy:
    needs: Build 
    runs-on: ubuntu-latest
    steps: 
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
      - name: output build artifacts
        run: ls -la dist/
      - name: Deploy to production
        run: echo "Deploying to production..."